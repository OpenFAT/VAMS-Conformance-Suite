# VerA, https://github.com/OmarSiwy/VerA. `vera --run` compiles and runs the
# testbench a test's `//!` lines describe, so one stage covers both.
# Run under VerA's `nix develop` (it pins the Zig that vera drives);
# VERA overrides the executable. The analog testbench prints its transcript
# on stderr, hence `2>&1`. Every run shares one Zig cache instead of one
# per work directory. A test that only has to compile (conform sets
# CONFORM_COMPILE_ONLY) runs `--check` (`--elab` for Verilog) instead of `--run`:
# its run is not judged, and an LRM example's `always #5 clk = ~clk` never ends.
# Manifest columns: DEFINES (`-D`, one per word), INCDIR (`-I`), SHIM (`-I` of
# an include directory under external/), DIRS (the
# directories an upstream runner creates in its cwd), LIBLIST (`-L`, one per word).
# ponytail: VERA defaults to the sibling checkout ../Zig/VerA (its
# zig-out/bin/vera), pinned there while VerA and the suite move together;
# switch to plain `vera` once VerA releases.
run.verilog-a   = ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} ${VERA:-$CONFORM_TOOLDIR/../../Zig/VerA/zig-out/bin/vera} $([ -n "$CONFORM_COMPILE_ONLY" ] && echo --check || echo --run) --sim=verilogA --no-std-defs $(for d in $CONFORM_DEFINES; do printf -- "-D%s " "$d"; done) -I "$CONFORM_INCLUDE" -I "$CONFORM_DIR" ${CONFORM_SHIM:+-I "$CONFORM_TOOLDIR/../external/$CONFORM_SHIM"} "$CONFORM_SRC" 2>&1
run.verilog-ams = ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} ${VERA:-$CONFORM_TOOLDIR/../../Zig/VerA/zig-out/bin/vera} $([ -n "$CONFORM_COMPILE_ONLY" ] && echo --check || echo --run) --no-std-defs ${CONFORM_STD:+--std=$CONFORM_STD} -I "$CONFORM_INCLUDE" -I "$CONFORM_DIR" "$CONFORM_SRC" 2>&1
run.spice       = ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} ${VERA:-$CONFORM_TOOLDIR/../../Zig/VerA/zig-out/bin/vera} --run --no-std-defs -I "$CONFORM_INCLUDE" -I "$CONFORM_DIR" "$CONFORM_SRC" 2>&1
# vera reads a `.sv` file as IEEE 1800 and refuses it; a manifest's 1364
# subset of sv-tests is handed over under a `.v` name.
run.verilog     = src=$CONFORM_SRC; case $src in *.sv) cp "$src" "$CONFORM_WORK/$CONFORM_STEM.v"; src=$CONFORM_WORK/$CONFORM_STEM.v;; esac; mkdir -p . $CONFORM_DIRS; ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} ${VERA:-$CONFORM_TOOLDIR/../../Zig/VerA/zig-out/bin/vera} $([ -n "$CONFORM_COMPILE_ONLY" ] && echo --elab || echo --run) "$src" -I "$CONFORM_DIR" ${CONFORM_INCDIR:+-I $CONFORM_INCDIR} -I "$CONFORM_INCLUDE" ${CONFORM_STD:+--std=$CONFORM_STD} ${CONFORM_PROTECT_KEYS:+--protect-keys $CONFORM_PROTECT_KEYS} ${CONFORM_EVENT_BUDGET:+--event-budget=$CONFORM_EVENT_BUDGET} ${CONFORM_LIBMAP:+--libmap $CONFORM_LIBMAP} $(for l in $CONFORM_LIBLIST; do printf -- "-L %s " "$l"; done) $CONFORM_FILES
# A `.c` VPI application (IEEE 1364-2005 ch. 26-27) links VerA's simulator,
# lib/libvera-vpi.a beside the vera it was installed with (VERA_VPI_LIB and
# VERA_VPI_INCLUDE override), and runs on its `//! design`; a `.va` design
# also gets the application, whose banner names the analyses. Its stdout and
# stderr stay apart: a `.expected.txt` is the application's stdout alone.
compile.vpi     = vera=${VERA:-$CONFORM_TOOLDIR/../../Zig/VerA/zig-out/bin/vera}; ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} zig cc -std=c99 -I "${VERA_VPI_INCLUDE:-$(dirname "$vera")/../include}" -I "$CONFORM_DIR" "$CONFORM_SRC" "${VERA_VPI_LIB:-$(dirname "$vera")/../lib/libvera-vpi.a}" -o "$CONFORM_STEM"
run.vpi         = design=$CONFORM_DIR/$(sed -n 's|^//! design ||p' "$CONFORM_SRC" | tr -d '\r'); case $design in *.va) set -- "$CONFORM_SRC";; *) set --;; esac; ZIG_LOCAL_CACHE_DIR=${CONFORM_ZIG_CACHE:-$HOME/.cache/conform-zig} VERA_PROTECT_KEYS=$CONFORM_PROTECT_KEYS "./$CONFORM_STEM" "$design" "$@"
