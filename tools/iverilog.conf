# Icarus Verilog (iverilog + vvp), from this flake's dev shell. IEEE 1364
# only. vvp's own `$finish called at` line (17.4.1 leaves the report to the
# tool) is dropped from the transcript; the exit status is vvp's.
# `//@ negative-timing` (CONFORM_NEGATIVE_TIMING, IEEE 1364-2005 15.5.4) stays
# unmapped: neither iverilog 13.0 nor vvp has an option that enables negative
# timing checks (their man pages; `-gspecify` elaborates specify blocks at all).
compile.verilog = std=${CONFORM_STD:-1364-2005}; iverilog -g${std#1364-} -I "$CONFORM_DIR" ${CONFORM_INCDIR:+-I $CONFORM_INCDIR} -o "$CONFORM_WORK/sim.vvp" "$CONFORM_SRC" $CONFORM_FILES
run.verilog     = vvp -n "$CONFORM_WORK/sim.vvp" > "$CONFORM_WORK/raw"; s=$?; grep -Ev '^[^ ]+:[0-9]+: \$(finish|stop)(\([0-9]\))? called at ' "$CONFORM_WORK/raw"; exit $s
